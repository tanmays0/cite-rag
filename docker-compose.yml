services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: citerag
      POSTGRES_PASSWORD: citerag
      POSTGRES_DB: citerag
    ports:
      - "5432:5432"
    volumes:
      - citerag_pgdata:/var/lib/postgresql/data
      - ./docker/init-pgvector.sql:/docker-entrypoint-initdb.d/01-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citerag -d citerag"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://citerag:citerag@db:5432/citerag
      DIRECT_DATABASE_URL: postgresql://citerag:citerag@db:5432/citerag
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-change-me-in-production-32chars}
      AUTH_URL: http://localhost:3000
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-demo@cite-rag.app}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-demo-cite-rag-2026}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-llama-3.3-70b-versatile}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      RETRIEVAL_DISTANCE_THRESHOLD: "0.55"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data/uploads:/app/data/uploads

volumes:
  citerag_pgdata:
